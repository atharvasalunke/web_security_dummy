<!DOCTYPE html>
<html>
<head>
    <title>Fake Social Network</title>
</head>
<body>
    <h1>Welcome to the Dummy Social Network</h1>
    {% if session["user"] %}
        <p>Logged in as {{ session["user"] }} | <a href="{{ url_for('logout') }}">Logout</a></p>
        <form action="{{ url_for('post') }}" method="post">
            <textarea name="content" placeholder="Write a post..."></textarea>
            <button type="submit">Post</button>
        </form>
    {% else %}
        <p><a href="{{ url_for('login') }}">Login</a> | <a href="{{ url_for('register') }}">Register</a></p>
    {% endif %}

    <h2>Recent Posts</h2>
    {% for post in posts %}
        <p><b>{{ post.author  }}</b>: {{ post.content |safe}}</p>
    {% endfor %}
</body>
</html>
