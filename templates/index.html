{% extends "base.html" %}

{% block title %}Home - FakeSocial{% endblock %}

{% block content %}
<div class="post-container">
    {% if session["user"] %}
        <div class="post">
            <form action="{{ url_for('post') }}" method="post">
                <textarea class="form-control mb-2" name="content" placeholder="What's on your mind?" required></textarea>
                <button type="submit" class="btn btn-primary w-100"><i class="fa fa-paper-plane"></i> Post</button>
            </form>
        </div>
    {% endif %}

    <h2 class="mt-4">Recent Posts</h2>
    <!-- User Posts -->
    <div class="mt-4">
        <h4>Your Posts</h4>
        <ul class="list-group">
            {% for post in posts %}
                <li class="list-group-item"><b>{{ post.author }}:</b> {{ post.content }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
